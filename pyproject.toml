[project]
name = "akili"
version = "2.0.0"
description = "After-School Learning App for Everyone"
readme = "README.md"
authors = [
    { name = "Nwokike", email = "onyeka@kiri.ng" }
]
requires-python = ">=3.13"
dependencies = [
    "flet>=1.0.2",
    "flet-ads>=1.0.2",
    "flet-android-notifications>=0.11.2",
    "flet-audio-recorder>=1.0.2",
    "flet-local-auth>=1.0.2",
    "flet-video>=1.0.2",
    "httpx>=0.28.1",
    "kani[mcp,openai]>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flet]
org = "ng.kiri"
product = "Akili"
company = "Kiri Research Labs"
build_number = 7
desktop_flavor = "full"

[tool.flet.app]
path = "src"

[tool.flet.splash]
color = "#FAFAFA"
dark_color = "#0F1114"

[tool.flet.android]
bundle_id = "ng.kiri.akili"

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx4g -XX:MaxMetaspaceSize=512m"

[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.RECORD_AUDIO" = true
"android.permission.WAKE_LOCK" = true
# OS notifications (flet-android-notifications): runtime permission prompt
# + exact alarms for assignment due-date nudges + reschedule after reboot.
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~3025212648"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 250
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# license_token.py is a byte-exact port of KTV Player's verifier — its
# control flow must not be reformatted, so SIM108 stays off here.
"src/services/license_token.py" = ["SIM108"]
